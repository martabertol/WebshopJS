<!DOCTYPE html>
<html lang="hr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>IT Webshop</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>IT Webshop</h1><p>Informatička oprema</p></header>
<main><section><h2>Proizvodi</h2><p>Označite proizvode i odaberite količine.</p><table><thead><tr><th>Odabir</th><th>Proizvod</th><th>Cijena</th><th>Količina</th></tr></thead><tbody id="proizvodi"></tbody></table><button id="dodaj">Dodaj u košaricu</button></section>
<section><h2>Košarica</h2><div id="kosarica"></div><p id="total">Ukupno: 0 €</p><button id="izbrisi">Izbriši zadnji</button> <button id="izbrisi_sve">Isprazni košaricu</button></section>
<section><h2>Podaci kupca</h2><label for="ime">Ime</label><input id="ime" type="text"><label for="prezime">Prezime</label><input id="prezime" type="text"><label for="drzave">Država</label><select id="drzave"><option value="">Odaberite državu</option><option value="HR">Hrvatska</option><option value="SI">Slovenija</option><option value="BIH">BiH</option></select><label for="gradovi">Grad</label><select id="gradovi"><option value="">Odaberite grad</option></select><button id="prikazi">Prikaži dostupne gradove</button><div id="lista_gradova"></div><fieldset><legend>Način plaćanja</legend><label><input type="radio" name="placanje" value="Pouzećem" checked> Pouzećem</label><label><input type="radio" name="placanje" value="Karticom"> Karticom</label></fieldset><button id="kupi">Naruči</button><p id="poruka" role="status"></p><div id="rezultat"></div></section></main><script src="app.js"></script></body></html>
